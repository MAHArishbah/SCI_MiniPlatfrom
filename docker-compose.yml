services:
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: sci-platform:local
    ports:
      - "8000:8000"
    environment:
      SCI_LOG_LEVEL: ${SCI_LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    restart: unless-stopped

  # Interactive GenAI assistant (CLI). Not started by `docker compose up`; run it with:
  #   docker compose run --rm assistant
  assistant:
    image: sci-platform:local
    profiles: ["assistant"]
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "sci.assistant.cli"]
    environment:
      SCI_API_URL: http://api:8000
      SCI_LLM_LOG: /app/logs/llm_calls.jsonl
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      SCI_LLM_INPUT_USD_PER_MTOK: ${SCI_LLM_INPUT_USD_PER_MTOK:-0.10}
      SCI_LLM_OUTPUT_USD_PER_MTOK: ${SCI_LLM_OUTPUT_USD_PER_MTOK:-0.50}
    volumes:
      - ./logs:/app/logs
    stdin_open: true
    tty: true
